<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>घराचे लोकेशन | माऊली कटके कार्यालय</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Vadodara', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.98);
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.30);
      animation: fadeIn .45s ease;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      font-size: 34px;
    }

    h1 {
      margin: 0 0 22px;
      color: #0f172a;
      font-size: 23px;
      font-weight: 700;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .65; cursor: wait; }

    #captureBtn {
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      box-shadow: 0 8px 20px rgba(99, 102, 241, .25);
    }

    #skipBtn {
      margin-top: 12px;
      color: #334155;
      background: #f1f5f9;
    }

    #status {
      min-height: 24px;
      margin-top: 18px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📍</div>
    <h1>घराचे लोकेशन</h1>

    <button id="captureBtn" type="button">📍 लोकेशन सुरू करा</button>
    <button id="skipBtn" type="button">लोकेशनशिवाय पुढे जा</button>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    // सर्वेक्षणाचा मुख्य फॉर्म
    const FORM_URL = "https://office.maulikatke.in/form/survey";

    // QR कोडमधील village_code, enumerator_code आणि इतर parameters जतन करा.
    const params = new URLSearchParams(window.location.search);

    // URL मध्ये आधीपासून असलेली लोकेशन लिंक वापरू नका.
    params.delete("google_maps_url");

    const captureBtn = document.getElementById("captureBtn");
    const skipBtn = document.getElementById("skipBtn");
    const statusText = document.getElementById("status");

    function goToSurvey() {
      const target = new URL(FORM_URL);
      target.search = params.toString();
      window.location.assign(target.toString());
    }

    captureBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusText.textContent = "या ब्राउझरमध्ये लोकेशन सुविधा उपलब्ध नाही.";
        return;
      }

      captureBtn.disabled = true;
      captureBtn.textContent = "लोकेशन मिळवत आहोत...";
      statusText.textContent = "कृपया लोकेशनची परवानगी द्या.";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const googleMapsLink =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(latitude + "," + longitude);

          params.set("google_maps_url", googleMapsLink);
          statusText.textContent = "लोकेशन मिळाले. सर्वेक्षण सुरू होत आहे...";
          captureBtn.textContent = "लोकेशन मिळाले ✓";

          window.setTimeout(goToSurvey, 900);
        },
        (error) => {
          const messages = {
            1: "लोकेशनची परवानगी नाकारली. कृपया ब्राउझरमध्ये परवानगी द्या.",
            2: "लोकेशन मिळू शकले नाही. फोनचे लोकेशन सुरू करून पुन्हा प्रयत्न करा.",
            3: "लोकेशन मिळवण्यास वेळ लागला. कृपया पुन्हा प्रयत्न करा."
          };

          statusText.textContent = messages[error.code] || "लोकेशन मिळू शकले नाही. पुन्हा प्रयत्न करा.";
          captureBtn.disabled = false;
          captureBtn.textContent = "📍 पुन्हा प्रयत्न करा";
        },
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    });

    skipBtn.addEventListener("click", () => {
      params.delete("google_maps_url");
      goToSurvey();
    });
  </script>
</body>
</html>
